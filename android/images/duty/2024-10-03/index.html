<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{background-color:#f3f4f6;font-family:system-ui,-apple-system,sans-serif;margin:0;padding:0}.container{max-width:1200px;margin:0 auto;padding:0 10%}.article-header{background-color:#fffbef;padding:10px}.article-header h1{font-size:2rem;font-weight:700;color:#6b2e2e;margin:0 0 10px 0}.author-info{display:flex;align-items:center}.avatar{width:40px;height:40px;border:4px solid #e03e3e;border-radius:50%;display:flex;justify-content:center;background-color:#fff;align-items:center;color:#743e3e;font-size:14px;margin-right:10px}.author-name{font-size:16px;font-weight:700;color:#3d2323;margin:0}.author-realname{font-size:14px;color:#9b5b5b;margin:0}.follow-btn{margin-left:auto;background-color:#925b5b;color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer}.content-block{background-color:#fff;padding:2rem;border-radius:8px;box-shadow:0 4px 6px rgba(0,0,0,.1);margin-bottom:2rem}p{color:#4b5563;line-height:1.6;margin-bottom:1.5rem}h2{font-size:1.5rem;font-weight:700;margin-bottom:1rem;color:#1f2937}.image-container{text-align:center;margin:1.5rem 0}.image-container img{max-width:50%;border-radius:8px;display:block;margin:0 auto 10px}.image-caption{font-size:.875rem;font-style:italic;color:#6b7280;margin-top:5px}.contribution-prompt{padding:1rem;border-top:1px solid #e5e7eb;margin-top:1rem}</style><title>团建日志</title></head><body class="font-sans"><div class="container"><div class="content-block"><p>时隔八个月，脑内映像已经模糊了；仅剩青色的天，树影也透气；粗糙的游乐设施与梦回零几年的小项目；据说东湖公园适合观鸟，上次只在波面瞥见一块白影。一群人溢出的活人气才给这次出行添些分量。</p><div class="image-container"><img src="https://gitee.com/justinc-gitee/project_resources/raw/main/android/images/duty/2024-10-03/hz.gif" alt="1" class="mx-auto"></div><div class="image-container"><img src="https://gitee.com/justinc-gitee/project_resources/raw/main/android/images/duty/2024-10-03/ph.jpg" alt="5" class="mx-auto"><p class="image-caption">合照</p></div><div class="image-container"><img src="https://gitee.com/justinc-gitee/project_resources/raw/main/android/images/duty/2024-10-03/cloverline.png" style="opacity:1" alt="1" class="mx-auto"></div><h2>俗世奇人</h2><p>每期必看，相信带伙都奔这块来的。希望猴头能保住吧。</p><div class="image-container"><img src="https://gitee.com/justinc-gitee/project_resources/raw/main/android/images/duty/2024-10-03/bunnylady.png" alt="2" class="mx-auto"><p class="image-caption">开幕雷击-兔女郎</p></div><div class="image-container"><img src="https://gitee.com/justinc-gitee/project_resources/raw/main/android/images/duty/2024-10-03/wb0.jpg" alt="2" class="mx-auto"><p class="image-caption">o.0</p></div><div class="image-container"><img src="https://gitee.com/justinc-gitee/project_resources/raw/main/android/images/duty/2024-10-03/giant.png" alt="3" class="mx-auto"><p class="image-caption">谁家车力巨人</p></div><div class="image-container"><img src="https://gitee.com/justinc-gitee/project_resources/raw/main/android/images/duty/2024-10-03/chainsawman.png" alt="4" class="mx-auto"><p class="image-caption">脖子缠风筝想起彩色大肠了</p></div><div class="image-container"><img src="https://gitee.com/justinc-gitee/project_resources/raw/main/android/images/duty/2024-10-03/yellowwind.png" alt="4" class="mx-auto"><p class="image-caption">透视真是太简单了.jpg</p></div><div class="image-container"><img src="https://gitee.com/justinc-gitee/project_resources/raw/main/android/images/duty/2024-10-03/dumb.jpg" alt="5" class="mx-auto"><p class="image-caption">看哭了，这些年大家都挺唐的</p></div></div><div class="content-block"><div class="image-container"><img src="https://gitee.com/justinc-gitee/project_resources/raw/main/android/images/duty/2024-10-03/long.png" alt="5" class="mx-auto"><p class="image-caption">前面忘了，后面忘了,总之如图</p></div><div class="image-container"><img src="https://gitee.com/justinc-gitee/project_resources/raw/main/android/images/duty/2024-10-03/loong.png" alt="5" class="mx-auto"></div><div class="image-container"><img src="https://gitee.com/justinc-gitee/project_resources/raw/main/android/images/duty/2024-10-03/looong.png" alt="5" class="mx-auto"><p class="image-caption">幻视🐅割</p></div><div class="image-container"><img src="https://gitee.com/justinc-gitee/project_resources/raw/main/android/images/duty/2024-10-03/borb.png" alt="5" class="mx-auto"><p class="image-caption">牢鸟依人</p></div><div class="image-container"><img src="https://gitee.com/justinc-gitee/project_resources/raw/main/android/images/duty/2024-10-03/cloverline.png" style="opacity:1" alt="1" class="mx-auto"></div></div><div class="content-block"><div class="image-container"><img src="https://gitee.com/justinc-gitee/project_resources/raw/main/android/images/duty/2024-10-03/cloverline.png" style="opacity:1" alt="1" class="mx-auto"></div><div class="image-container"><img src="https://gitee.com/justinc-gitee/project_resources/raw/main/android/images/duty/2024-10-03/shuipiao.gif" alt="5" class="mx-auto"><p class="image-caption">基于涡旋诱导升力的二维抛体跨介质连续运动研究</p></div><div class="image-container"><img src="https://gitee.com/justinc-gitee/project_resources/raw/main/android/images/duty/2024-10-03/jzdw0.jpg" alt="5" class="mx-auto"><p class="image-caption">蒋政带玉</p></div><div class="image-container"><img src="https://gitee.com/justinc-gitee/project_resources/raw/main/android/images/duty/2024-10-03/jzdw1.jpg" alt="5" class="mx-auto"></div><div class="image-container"><img src="https://gitee.com/justinc-gitee/project_resources/raw/main/android/images/duty/2024-10-03/lyz.jpg" alt="5" class="mx-auto"></div></div><div class="content-block"><h2>小景</h2><p>没错，每当各位看到这个标题就说明我们没东西可播了=o</p><div class="image-container"><img src="https://gitee.com/justinc-gitee/project_resources/raw/main/android/images/duty/2024-10-03/river.jpg" alt="5" class="mx-auto"></div><div class="image-container"><img src="https://gitee.com/justinc-gitee/project_resources/raw/main/android/images/duty/2024-10-03/ovo.jpg" alt="5" class="mx-auto"></div><div class="image-container"><img src="https://gitee.com/justinc-gitee/project_resources/raw/main/android/images/duty/2024-10-03/view.jpg" alt="5" class="mx-auto"></div><div class="image-container"><img src="https://gitee.com/justinc-gitee/project_resources/raw/main/android/images/duty/2024-10-03/landscape.png" alt="5" class="mx-auto"></div><div class="image-container"><img src="https://gitee.com/justinc-gitee/project_resources/raw/main/android/images/duty/2024-10-03/flos.png" alt="5" class="mx-auto"></div></div><div class="content-block contribution-prompt"><p>如果有素材可以投稿（）</p></div></div></body></html>
